name: mongo-check
on:
  push:
    branches: [mongo-check]
permissions:
  contents: read
jobs:
  libredb-1456:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongo: ["7.0", "8.0", "8.2"]
    services:
      mongo:
        image: mongo:${{ matrix.mongo }}
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: Jeevan2410/libredb-studio
          ref: fix/mongodb-nullable-inference
          path: libredb
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: libredb
      - run: cp ../harness/scripts/libredb-1456.ts ./check-1456.ts && bun run check-1456.ts
        working-directory: libredb
