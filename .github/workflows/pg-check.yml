name: pg-check
on:
  push:
    branches: [pg-check]
permissions:
  contents: read
jobs:
  role-lifecycle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["postgres:15", "postgres:17"]
    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=0 -f scripts/role-lifecycle.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
